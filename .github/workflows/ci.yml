name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # swift-format ships with Xcode, so there is nothing to install. The rules
      # live in .swift-format; fix findings with
      #   xcrun swift-format format --in-place --recursive AudioRecorder AudioRecorderTests
      - name: swift-format lint
        run: xcrun swift-format lint --strict --recursive AudioRecorder AudioRecorderTests

  test:
    # "Build and test" is the check required by the branch protection rule on
    # main, so its name must stay exactly as it is.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test
            os: macos-26
          # An older OS than the default runner. The macOS 15 image defaults to
          # Xcode 16, which is too old for this project, so select Xcode 26.3.
          - name: Build and test (macOS 15)
            os: macos-15
            xcode: /Applications/Xcode_26.3.app
            # actool (Xcode 26.3) crashes compiling the Icon Composer .icon on the
            # macOS 15 runner image ("AssetCatalogAgent closed the connection"),
            # so this job builds without the app icon. It isn't needed by the tests.
            skip_icon: true
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: matrix.xcode != ''
        run: sudo xcode-select -s "${{ matrix.xcode }}"

      - name: Remove the app icon (actool crashes on this runner)
        if: matrix.skip_icon
        run: rm -rf AudioRecorder/AppIcon.icon

      - name: Show versions
        run: |
          sw_vers
          xcodebuild -version

      # The project is signed with a personal team, which the runner doesn't
      # have, so build with an ad-hoc signature instead.
      - name: Build and run tests
        run: |
          xcodebuild test \
            -scheme AudioRecorder \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=NO \
            ${{ matrix.skip_icon && 'ASSETCATALOG_COMPILER_APPICON_NAME=' || '' }}

      # Shows up on the workflow run page and in the coverage.json artifact. It is
      # informational only: no minimum is enforced.
      - name: Coverage summary
        if: success()
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          python3 .github/scripts/coverage_summary.py coverage.json

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.json

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.os }}
          path: TestResults.xcresult
